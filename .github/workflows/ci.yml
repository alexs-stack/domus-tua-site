name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest

    env:
      # Safe placeholder values so the build never fails in CI.
      # Real values are configured in Vercel (which owns deploy).
      NEXT_PUBLIC_SITE_URL: https://example.com
      NEXT_PUBLIC_USE_REALSMART: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Test deterministici: modello finto (ai/test) e fixture immobili, nessuna rete.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # 81 casi sul parser della ricerca in linguaggio naturale, condiviso con /api/search.
      # Esisteva già ma non girava in CI: una modifica al parser poteva romperlo in silenzio.
      - name: Test parser ricerca
        run: npm run test:parser

      # E2E: risposte simulate via intercettazione di rete, nessuna chiave, nessuna rete.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: End-to-end
        run: npm run e2e
